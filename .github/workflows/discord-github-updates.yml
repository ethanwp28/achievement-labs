name: Discord GitHub updates

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Always run the script from the trusted default branch. In particular,
      # never check out or execute code from an untrusted pull request head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Post update
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_WEBHOOK_URL }}
        run: node tools/post-discord-github-update.mjs
